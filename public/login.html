<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sahvana Ranch · Sign in</title>
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sahvana Ranch">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:light-dark(#fff,#10131c);--ink:light-dark(#171a22,#eef0f6);--soft:light-dark(#5d6375,#a2a9bb);--line:light-dark(#e2e4ec,#2a3042);--panel:light-dark(#f4f5f9,#181c28)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif;padding:24px}
.box{width:min(380px,100%)}
.mark{width:64px;height:64px;border-radius:18px;display:block;margin-bottom:18px}
h1{font-size:34px;line-height:1.05;margin:0 0 6px;font-weight:800;letter-spacing:-.02em}
p{color:var(--soft);margin:0 0 22px}
label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
input{width:100%;min-height:50px;font:inherit;font-size:17px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:inherit}
input:focus-visible,button:focus-visible{outline:3px solid #d98a12;outline-offset:2px}
button{width:100%;min-height:52px;margin-top:14px;border:0;border-radius:12px;background:var(--ink);color:var(--bg);font:inherit;font-weight:700;font-size:17px;cursor:pointer}
.err{background:light-dark(#fde6ea,#43192330);color:light-dark(#9b1c33,#ff9aac);padding:10px 14px;border-radius:10px;margin-bottom:14px;font-weight:600;display:none}
</style>
</head>
<body>
<form class="box" method="post" action="/login">
  <img class="mark" src="/icon-192.png" alt="">
  <h1>Sahvana Ranch</h1>
  <p>Bookings, event hall, tours and payments.</p>
  <div class="err" id="err"></div>
  <label for="pw">Password</label>
  <input id="pw" name="password" type="password" autocomplete="current-password" required autofocus>
  <button type="submit">Sign in</button>
</form>
<script>
{const e=new URLSearchParams(location.search).get('e');const el=document.getElementById('err');
if(e){el.style.display='block';el.textContent=e==='wait'?'Too many tries. Wait 15 minutes and try again.':'That password is not right. Try again.'}}
</script>
</body>
</html>
